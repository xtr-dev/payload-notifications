name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Run the official code-review skill and post findings on the PR.
          # The PR number is passed explicitly, so review scope is always the
          # triggering PR rather than anything the skill might infer.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

          # --model pins the current Sonnet alias so this job does not depend on
          # a retired dated model snapshot. --allowedTools is required so the
          # action starts the MCP server that posts inline comments.
          claude_args: '--model sonnet --allowedTools "mcp__github_inline_comment__create_inline_comment"'
