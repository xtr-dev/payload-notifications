name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same commands as the `check` input of release.yml, plus typecheck.
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p dev/tsconfig.json
      - run: pnpm test:int
      - run: pnpm build
      - run: pnpm test:published-exports
      - run: pnpm test:declarations
