# Manual release: Actions → Release → Run workflow.
# Version and CHANGELOG.md are derived from conventional commits since the last tag.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview only (build and pack, publish nothing)
        type: boolean
        default: false
      release-as:
        description: Force this exact version (optional, e.g. 1.0.0)
        type: string
        default: ''
      preid:
        description: Pre-release identifier (optional, e.g. beta)
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: xtr-dev/.github/.github/workflows/plugin-release.yml@v1
    with:
      dry-run: ${{ inputs.dry-run }}
      release-as: ${{ inputs.release-as }}
      preid: ${{ inputs.preid }}
      # test:int runs every vitest suite, including the src/**/*.spec.ts unit tests that
      # test:unit selects. published-exports and declarations import dist/, so the build
      # has to run first; plugin-release.yml builds again after the version bump.
      # pnpm lint is left out: it fails on main (about 300 perfectionist/sort-* errors).
      check: |
        pnpm test:int
        pnpm build
        pnpm test:published-exports
        pnpm test:declarations
